[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = [
    "dashboard_test.py",
    "striker_shots.py",
    "recording_session.py",
    "session_replay.py",
    "camera_recording.py",
    "test_worker_scheduling.py",
]
python_functions = [
    "test_*",
    "goal_*",
    "enemy_*",
    "midfield_*",
    "close_*",
    "hiding_*",
    "blocked_*",
    "after_*",
    "boundary_*",
    "writes_*",
    "refuses_*",
    "timeline_*",
    "loads_*",
    "annotation_*",
    "inference_*",
]

[tool.ruff]
required-version = ">=0.16.2"
extend-exclude = []

[tool.ruff.lint]
# Best-effort hardware shutdown and background reader loops intentionally catch broad exceptions.
ignore = ["BLE001", "S110"]
